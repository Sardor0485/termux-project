<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        .card { background: var(--tg-theme-secondary-bg-color); border: none; border-radius: 12px; margin-bottom: 10px; }
        .btn-main { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); }
    </style>
</head>
<body>
    <div class="container py-3">
        <h4 class="mb-3 text-center">📦 Raqamli Ombor</h4>
        
        <div id="stats" class="row mb-3 px-2">
            </div>

        <div id="product-list">
            </div>

        <button class="btn btn-main w-100 mt-3" onclick="Telegram.WebApp.close()">Yopish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Saytni to'liq ekranga yoyish

        async function loadProducts() {
            const res = await fetch('/api/products');
            const data = await res.json();
            const list = document.getElementById('product-list');
            
            list.innerHTML = data.map(item => `
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold">${item.code}</div>
                            <small class="text-muted">Joy: ${item.row_char}-${item.row_num}</small>
                        </div>
                        <span class="badge bg-primary fs-6">${item.count} dona</span>
                    </div>
                </div>
            `).join('');
        }

        loadProducts();
    </script>
</body>
</html>
